 height="19" width="32.0625"><div style="display: inline-block; white-space: nowrap;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel">Do Y</span></div></foreignObject></g></g></g></g></g><style>/* ========== arrow test ========== */
svg {
  outline: 6px solid magenta !important; /* 方便确认 CSS 是否加载 */
}

/* 连线加粗 */
.edgePath path {
  stroke-width: 4px !important;
  stroke: #000 !important;
}

/* 三重覆盖箭头实现（兼容所有版本） */
.arrowheadPath,
marker path,
defs marker path {
  stroke-width: 4px !important;
  fill: red !important;
  stroke: red !important;
  transform: scale(3.5) !important;
  transform-box: fill-box;
  transform-origin: center;
}

/* 节点形状上色，仅为方便区分 */
.node rect:not([rx]) { fill: #e6fffa !important; stroke: #2db6a3 !important; }
.node rect[rx]      { fill: #f0f9ff !important; stroke: #7aa2f7 !important; }
.node polygon       { fill: #fff7e6 !important; stroke: #f0a020 !important; }
</style></svg>